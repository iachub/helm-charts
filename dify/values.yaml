###################################
# External PostgreSQL Configuration
# These settings are only used when `externalPostgres.enabled` is set to true
# When enabled, the chart will use an external PostgreSQL database instead of the built-in one
###################################
externalPostgres:
  # Set to true to use an external PostgreSQL database
  enabled: false
  # PostgreSQL username
  username: "postgres"
  # PostgreSQL password - CHANGE THIS IN PRODUCTION
  password: "difyai123456"
  # PostgreSQL server address
  address: localhost
  # PostgreSQL server port
  port: 5432
  # Database names for different components
  database:
    # Database for API and worker components
    api: "dify"
    # Database for plugin daemon component
    pluginDaemon: "dify_plugin"
  # Maximum number of open connections to the database
  maxOpenConns: 20
  # Maximum number of idle connections in the pool
  maxIdleConns: 5

###################################
# External S3 Storage Configuration
# These settings are only used when `externalS3.enabled` is set to true
# When enabled, the chart will use S3-compatible storage instead of Persistent Volumes
###################################
externalS3:
  # Set to true to use external S3-compatible storage
  # IMPORTANT: When enabled, PVCs will not be used for storage
  enabled: false
  # S3 endpoint URL (e.g., AWS S3, MinIO, Cloudflare R2, etc.)
  endpoint: "https://xxx.r2.cloudflarestorage.com"
  # S3 access key - CHANGE THIS IN PRODUCTION
  accessKey: "ak-difyai"
  # S3 secret key - CHANGE THIS IN PRODUCTION
  secretKey: "sk-difyai"
  # Whether to use SSL for S3 connections
  useSSL: false
  # Bucket names for different components
  bucketName:
    # Bucket for API and worker components (required if externalS3.enabled is true)
    api: "difyai"
    # Bucket for plugin daemon component (optional)
    # If specified, plugin daemon will use this bucket instead of a PersistentVolume
    pluginDaemon:
  # Whether to use IAM roles for authentication instead of access/secret keys
  useIAM: false
  # S3 region
  region: "us-east-1"

###################################
