{{- if .Values.ssrfProxy.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "dify.ssrfProxy.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: ssrf-proxy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ template "dify.sandbox.fullname" . }}
  minReplicas: {{ .Values.sandbox.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.sandbox.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.ssrfProxy.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ssrfProxy.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.ssrfProxy.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.ssrfProxy.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
