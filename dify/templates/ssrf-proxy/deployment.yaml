{{- if .Values.ssrfProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dify.ssrfProxy.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: ssrf-proxy
spec:
  {{- if not .Values.ssrfProxy.autoscaling.enabled }}
  replicas: {{ .Values.ssrfProxy.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: ssrf-proxy
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: ssrf-proxy
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/ssrf-proxy/configmap.yaml") . | sha256sum }}
      {{- if .Values.ssrfProxy.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.ssrfProxy.podAnnotations "context" $) | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dify.ssrfProxy.serviceAccountName" . }}
      {{- if .Values.ssrfProxy.podSecurityContext }}
      securityContext:
        {{- include "common.tplvalues.render" (dict "value" .Values.ssrfProxy.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.image.ssrfProxy.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.ssrfProxy.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: ssrf-proxy
          image: {{ include "common.images.image" (dict "imageRoot" .Values.image.ssrfProxy "global" .Values.global) }}
          imagePullPolicy: {{ .Values.image.ssrfProxy.pullPolicy }}
          {{- if .Values.ssrfProxy.containerSecurityContext }}
          securityContext:
            {{- include "common.tplvalues.render" (dict "value" .Values.ssrfProxy.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.ssrfProxy.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.ssrfProxy.customLivenessProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.ssrfProxy.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.ssrfProxy.customReadinessProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.ssrfProxy.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.ssrfProxy.customStartupProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.ssrfProxy.extraEnv }}
          env:
            {{- include "common.tplvalues.render" (dict "value" .Values.ssrfProxy.extraEnv "context" $) | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ssrfProxy.service.port }}
              protocol: TCP
          {{- if .Values.ssrfProxy.resources }}
          resources: {{- toYaml .Values.ssrfProxy.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: squid-conf
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
          {{- if .Values.ssrfProxy.log.persistence.enabled }}
            - name: log
              mountPath: {{ .Values.ssrfProxy.log.persistence.mountPath }}
              {{- if .Values.ssrfProxy.log.persistence.persistentVolumeClaim.subPath }}
              subPath: {{ .Values.ssrfProxy.log.persistence.persistentVolumeClaim.subPath }}
              {{- end }}
          {{- end }}
      {{- if .Values.ssrfProxy.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.ssrfProxy.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.ssrfProxy.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.ssrfProxy.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.ssrfProxy.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.ssrfProxy.tolerations "context" $) | nindent 8 }}
      {{- end }}
      volumes:
        - name: squid-conf
          configMap:
            defaultMode: 420
            name: {{ template "dify.ssrfProxy.fullname" . }}
      {{- if .Values.ssrfProxy.log.persistence.enabled }}
        - name: log
          persistentVolumeClaim:
            claimName: {{ .Values.ssrfProxy.log.persistence.persistentVolumeClaim.existingClaim | default (include "dify.ssrfProxy.fullname" .) }}
      {{- end }}
{{- end }}
