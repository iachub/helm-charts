apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dify.api.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/api/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/api/secret.yaml") . | sha256sum }}
      {{- if .Values.api.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.api.podAnnotations "context" $) | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dify.api.serviceAccountName" . }}
      {{- if .Values.api.podSecurityContext }}
      securityContext:
        {{- include "common.tplvalues.render" (dict "value" .Values.api.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.image.api.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.api.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "common.images.image" (dict "imageRoot" .Values.image.api "global" .Values.global) }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          {{- if .Values.api.containerSecurityContext }}
          securityContext:
            {{- include "common.tplvalues.render" (dict "value" .Values.api.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.api.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.api.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.api.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.api.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.api.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.api.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.api.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.api.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.api.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.api.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.api.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.api.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
            successThreshold: {{ .Values.api.startupProbe.successThreshold }}
          {{- end }}
          env:
            - name: MODE
              value: "api"
          {{- if .Values.api.extraEnv }}
            {{- include "common.tplvalues.render" (dict "value" .Values.api.extraEnv "context" $) | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ template "dify.api.fullname" . }}
            - secretRef:
                name: {{ template "dify.api.fullname" . }}
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          {{- if .Values.api.resources }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- end }}
          {{- if and (not .Values.externalS3.enabled) .Values.api.persistence.mountPath }}
          volumeMounts:
            - name: storage
              mountPath: {{ .Values.api.persistence.mountPath }}
              {{- if .Values.api.persistence.persistentVolumeClaim.subPath }}
              subPath: {{ .Values.api.persistence.persistentVolumeClaim.subPath }}
              {{- end }}
          {{- end }}
      {{- if .Values.api.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.api.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.api.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.api.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.api.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.api.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if and (not .Values.externalS3.enabled) .Values.api.persistence.mountPath }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.api.persistence.persistentVolumeClaim.existingClaim | default (include "dify.api.fullname" .) }}
      {{- end }}
